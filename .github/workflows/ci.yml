name: Exemplo CI

on:
  push:
  pull_request:

jobs:
  executar-javascript:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Executar index.js
        run: node index.js
        